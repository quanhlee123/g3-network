# CI G3 Network — lint + test toàn workspace mỗi lần push/PR (quy tắc 7: test đỏ = không merge).
name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cài phụ thuộc
        run: npm ci
      - name: Lint (ESLint + Prettier)
        run: npm run lint
      - name: Test toàn workspace
        run: npm test

  gitleaks:
    name: Quét secret (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
