# CI G3 Network — lint + test toàn workspace mỗi lần push/PR (quy tắc 7: test đỏ = không merge).
name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    # Test packages/db (và ingest/csms từ Prompt 05) cần PostgreSQL thật có TimescaleDB
    # + PostGIS — cùng image với container g3-db local (infra/docker-compose.yml).
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: g3
          # Giá trị dùng một lần cho container sống vài phút trong CI — không phải secret
          POSTGRES_PASSWORD: g3_ci_khong_phai_secret # gitleaks:allow
          POSTGRES_DB: g3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U g3 -d g3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://g3:g3_ci_khong_phai_secret@localhost:5432/g3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cài phụ thuộc
        run: npm ci
      - name: Lint (ESLint + Prettier)
        run: npm run lint
      - name: Test toàn workspace
        run: npm test

  gitleaks:
    name: Quét secret (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cài gitleaks (cùng phiên bản với máy dev)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Quét toàn bộ lịch sử git
        run: gitleaks git . --no-banner --redact -v
