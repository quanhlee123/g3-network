# Hạ tầng local G3 Network (Phase 1 — simulator, không expose ra internet công cộng).
# Chạy từ gốc repo: docker compose -f infra/docker-compose.yml up -d
# Biến môi trường đọc từ infra/.env (npm install tự tạo từ .env.example).
name: g3-network

services:
  db:
    # 1 container duy nhất có sẵn PostgreSQL 16 + TimescaleDB + PostGIS
    image: timescale/timescaledb-ha:pg16
    container_name: g3-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thieu bien - copy infra/.env.example thanh infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thieu bien - copy infra/.env.example thanh infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Thieu bien - copy infra/.env.example thanh infra/.env}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/home/postgres/pgdata/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  emqx:
    # MQTT broker cho telemetry xe (MQTT 1883, MQTT-over-WebSocket 8083, dashboard 18083)
    image: emqx/emqx:5.8
    container_name: g3-emqx
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD__DEFAULT_PASSWORD:?Thieu bien - copy infra/.env.example thanh infra/.env}
    ports:
      - '1883:1883'
      - '8083:8083'
      - '18083:18083'
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ['CMD', 'emqx', 'ctl', 'status']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # --- NF-14: quan sát hệ thống (mức KHUNG Phase 1) --------------------------------
  # Chỉ bind ra 127.0.0.1: bảng điều khiển vận hành KHÔNG được lộ ra mạng (quy tắc 12).

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: g3-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 15 ngày là đủ cho Phase 1 (load test + nghiệm thu). Lưu trữ dài hạn là chuyện
      # của NF-16 và nằm ở PostgreSQL/TimescaleDB, không phải ở Prometheus.
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # Service Node chạy TRÊN MÁY chứ không trong compose; dòng này cho container gọi
    # ngược ra host trên Linux (Docker Desktop Win/Mac đã có sẵn host.docker.internal).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: g3-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Thieu bien - copy infra/.env.example thanh infra/.env}
      # Phase 1 chạy local: tắt đăng ký, tắt gửi thống kê ra ngoài, tắt kiểm tra bản mới.
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  db-data:
  emqx-data:
  prometheus-data:
  grafana-data:
